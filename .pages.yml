media:
  input: public/uploads
  output: /uploads
  rename: true
  categories: [image]

content:
  - name: photography
    label: Photography albums
    type: collection
    path: content/photography
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: title
      fields: [title, category, year, featured]
      sort: year
      order: desc
    fields:
      - name: title
        label: Album title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Lowercase words separated by hyphens.
      - name: year
        label: Year
        type: string
        required: true
      - name: date
        label: Photoshoot date
        type: date
        required: false
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Concert, Convention, Portrait, Product, Event, Personal]
      - name: location
        label: Location
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
        options:
          maxlength: 280
      - name: story
        label: Short story
        type: text
        required: false
        description: A few sentences about the atmosphere, assignment, or intention behind the set.
      - name: instagram
        label: Instagram photoset URL
        type: string
        required: false
      - name: featured
        label: Featured album
        type: boolean
      - name: tags
        label: Tags
        type: select
        list: true
        options:
          values:
            - Photography
            - Videography
            - Video Editing
            - Marketing
            - Brand Consulting
            - Product Design
            - Game Development
            - Server Infrastructure
            - Social Media Marketing
            - 3D Design
            - Minecraft Servers
            - Graphic Design
            - Project Management
      - name: image
        label: Legacy cover image
        type: image
        required: false
        description: Optional fallback used by older albums.
      - name: alt
        label: Album cover alt text
        type: string
        required: true
      - name: images
        label: Album photographs
        type: object
        required: true
        list:
          min: 5
          max: 20
          collapsible:
            collapsed: true
            summary: "Photo {index}: {caption}"
        fields:
          - name: image
            label: Photograph
            type: image
            required: true
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: true
          - name: alt
            label: Alt text
            type: string
            required: true
          - name: caption
            label: Optional caption
            type: string
            required: false

settings:
  content:
    merge: true
  commit:
    message: "Update {content} in Pages CMS"
