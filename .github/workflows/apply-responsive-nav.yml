name: Apply responsive navigation overhaul
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-responsive-nav.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive source
        shell: bash
        run: |
          echo '' | base64 --decode > update.zip
          unzip -o update.zip
          rm update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/scroll-header.tsx
          git commit -m "Overhaul responsive navigation and mobile layouts"
          git push
