name: Apply final whimsical refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-final-whimsy.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refreshed source
        shell: bash
        run: |
          echo '' | base64 --decode > final-refresh.zip
          unzip -o final-refresh.zip
          rm final-refresh.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine whimsical layout, collaborators, journal, and page wash"
          git push
