name: Apply impact and journal refinement
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-impact-journal.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refined source
        shell: bash
        run: |
          echo '' | base64 --decode > refinement.zip
          unzip -o refinement.zip
          rm refinement.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine collaborator, impact, and journal sections"
          git push
