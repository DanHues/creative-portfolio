name: Apply structural portfolio refresh
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-structural-refresh.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refreshed source
        shell: bash
        run: |
          echo '' | base64 --decode > refresh.zip
          unzip -o refresh.zip
          rm refresh.zip
          rm -f components/route-wash.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine hero, navigation, projects, about, and journal"
          git push
