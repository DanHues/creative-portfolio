name: Apply journal divider dot fix
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-journal-divider-fix.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply divider fix
        shell: bash
        run: |
          echo '' | base64 --decode > update.zip
          unzip -o update.zip
          rm update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Place the journal divider before the dotted phase"
          git push
