name: Apply whimsical portfolio refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-whimsy-refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refreshed source
        shell: bash
        run: |
          echo '' | base64 --decode > whimsy-refresh.zip
          unzip -o whimsy-refresh.zip
          rm whimsy-refresh.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add whimsical hero, interactive tags, and polaroid projects"
          git push
