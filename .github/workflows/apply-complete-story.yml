name: Apply complete portfolio story
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-complete-story.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete story
        shell: bash
        run: |
          echo '' | base64 --decode > story.zip
          unzip -o story.zip
          rm story.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand the portfolio story and self-taught practice"
          git push
