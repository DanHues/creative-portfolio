name: Apply interactive marquees and navigation details
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-interactive-marquees.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interactive source
        shell: bash
        run: |
          echo '' | base64 --decode > update.zip
          unzip -o update.zip
          rm update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Add draggable marquees and navigation details"
          git push
