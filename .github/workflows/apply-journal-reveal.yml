name: Apply journal content reveal
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-journal-reveal.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply journal reveal
        shell: bash
        run: |
          echo '' | base64 --decode > update.zip
          unzip -o update.zip
          rm update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move and reveal the journal content independently"
          git push
