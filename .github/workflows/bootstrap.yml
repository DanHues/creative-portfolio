name: Expand portfolio source

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source package
        run: |
          unzip -o site-source-20260727.zip
          rm -f site-source-20260727.zip
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch creative portfolio with Pages CMS"
          git push
