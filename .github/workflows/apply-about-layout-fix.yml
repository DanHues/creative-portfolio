name: Apply about and client layout fix
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-about-layout-fix.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout fix
        shell: bash
        run: |
          echo '' | base64 --decode > fix.zip
          unzip -o fix.zip
          rm fix.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix about proportions and separate collaborator showcase"
          git push
