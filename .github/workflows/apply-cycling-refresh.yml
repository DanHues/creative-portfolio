name: Apply cycling portfolio refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-cycling-refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refreshed source
        shell: bash
        run: |
          echo '' | base64 --decode > cycling-refresh.zip
          unzip -o cycling-refresh.zip
          rm cycling-refresh.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine cycling hero, layered marquee, client ribbon, and journal blocks"
          git push
