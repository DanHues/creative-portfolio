name: Apply DanHues brand refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-brand-refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updated source
        shell: bash
        run: |
          echo '' | base64 --decode > brand-refresh.zip
          unzip -o brand-refresh.zip
          rm brand-refresh.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply DanHues brand and photography section"
          git push
